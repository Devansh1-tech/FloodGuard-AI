# =============================================================================
# FloodGuard AI — Render Infrastructure as Code (Blueprint)
# https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ── 1. Backend Web Service (FastAPI + Python 3.12) ─────────────────────────
  - type: web
    name: floodguard-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/init_db.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: USE_SQLITE
        value: true
      - key: SQLITE_DB_PATH
        value: floodguard_prod.db
      - key: STORAGE_LOCAL_ROOT
        value: outputs
      - key: LOG_FILE_PATH
        value: logs/backend.log
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: '["*"]'
      - key: CORS_ORIGINS
        value: '["*"]'

  # ── 2. Frontend Static Site (React 19 + Vite 6 + Tailwind CSS) ─────────────
  - type: web
    name: floodguard-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # SPA Catch-all Rewrite: Redirects all client routes to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Automatically wires the backend's Render hostname to Vite's build environment
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: floodguard-ai-backend
          property: host
      - key: NODE_VERSION
        value: 20.18.0
